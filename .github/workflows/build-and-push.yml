name: Build and Push to GHCR

# Publishes the container image this repository is used through:
#   ghcr.io/<owner>/sas-mcp-usecase
#
# Every build pushes these tags:
#   :latest          the build most recently published (whatever triggered it)
#   :<version>       the version in pyproject.toml, e.g. :2.0.0
#   :sha-<short>     the exact commit
#   :<branch>        the branch name, for builds started from a branch
# A `v*` git tag additionally pushes the semver tags (:2.0.0, :2.0, :2).
#
# Triggers: a push to main, a `v*` tag, or "Run workflow" in the Actions tab
# (workflow_dispatch) on any branch — the last is how a branch build is
# published without merging first.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Image name and version
        id: vars
        # A DISTINCT package name from the full-copilot server (sas-mcp-server)
        # so this use-case build never overwrites it. GHCR needs lowercase.
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sas-mcp-usecase" >> "$GITHUB_OUTPUT"
          version="$(grep -m1 -E '^version *= *"' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building ${version}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.vars.outputs.version }}
            type=sha,format=short,prefix=sha-
            type=ref,event=branch,enable=${{ github.ref_type == 'branch' && github.ref_name != 'main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=sas-mcp-usecase
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
